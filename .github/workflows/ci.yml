name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://avida:avida@localhost:5432/avida?schema=public
  REDIS_URL: redis://localhost:6379

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: avida
          POSTGRES_PASSWORD: avida
          POSTGRES_DB: avida
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U avida" --health-interval 5s
          --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # §5.9 — configuration guards run before anything expensive.
      - name: Check env declarations
        run: pnpm check:env
      - name: Check for client-exposed secrets
        run: pnpm check:secrets

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Apply migrations
        run: pnpm --filter @avida/db migrate:deploy

      - name: Seed
        run: pnpm db:seed

      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      # §5.9 — a high-severity advisory fails the build, it does not warn.
      - name: Audit dependencies
        run: pnpm audit --audit-level=high
