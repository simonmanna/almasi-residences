# Local development services. Production uses managed Postgres + Cloudflare R2.
name: avida

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: avida-postgres
    environment:
      POSTGRES_USER: avida
      POSTGRES_PASSWORD: avida
      POSTGRES_DB: avida
    ports: ['5432:5432']
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U avida -d avida']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: avida-redis
    command: ['redis-server', '--appendonly', 'yes']
    ports: ['6379:6379']
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  # Stands in for Cloudflare R2 locally — same S3 API.
  minio:
    image: minio/minio:latest
    container_name: avida-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'   # S3 API
      - '9001:9001'   # console
    volumes:
      - miniodata:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 20

  # Creates the buckets once, then exits. Originals stay private (§5.9).
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/avida-media;
      mc mb --ignore-existing local/avida-originals;
      mc anonymous set download local/avida-media;
      echo 'buckets ready: avida-media (public read), avida-originals (private)';
      "

volumes:
  pgdata:
  redisdata:
  miniodata:
